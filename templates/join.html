<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join Quiz | Brain Builder</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

    <style>
        :root {
            --bg: #fafaf7;
            --surface: #ffffff;
            --ink: #1a1a1a;
            --muted: #6b7280;
            --line: #ececec;
            --field: #f6f6f3;
            --accent: #ff5b2e;
            --accent-soft: #fff1ec;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Match */
        .navbar {
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            border-bottom: 1px solid var(--line);
        }

        .logo {
            font-family: 'Fraunces', serif;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
        }

        .nav-link {
            text-decoration: none;
            color: var(--ink);
            font-weight: 600;
            font-size: 0.9rem;
            margin-left: 24px;
            transition: color 0.2s;
        }

        .nav-link:hover { color: var(--accent); }

        /* Join Card Styling */
        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .join-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.03);
            text-align: center;
        }

        .form-title {
            font-family: 'Fraunces', serif;
            font-size: 2.5rem;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .form-subtitle {
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 32px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            margin-bottom: 8px;
            margin-left: 4px;
        }

        .input-field {
            width: 100%;
            padding: 16px;
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--ink);
            outline: none;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            background: var(--surface);
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }

        .btn-full {
            width: 100%;
            padding: 16px;
            background: var(--ink);
            color: var(--bg);
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-full:hover {
            background: #000;
            transform: translateY(-1px);
        }

        .error-msg {
            margin-top: 20px;
            padding: 12px;
            background: #fff5f5;
            border-radius: 8px;
            color: #c53030;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid #feb2b2;
        }

        .highlight { color: var(--accent); font-style: italic; }

        /* Floating Decoration Match */
        .icon { font-size: 2rem; position: absolute; opacity: 0.2; pointer-events: none; }
        .i1 { top: 15%; left: 10%; transform: rotate(-15deg); }
        .i3 { bottom: 15%; right: 10%; transform: rotate(15deg); }

        @media (max-width: 480px) {
            .join-card { padding: 32px 24px; }
            .form-title { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <header class="navbar animate__animated animate__fadeInDown">
        <div class="logo">Brain Builder</div>
        <nav>
            <a href="{{url_for('login.home')}}" class="nav-link">Home</a>
            <a href="{{url_for('login.profile')}}" class="nav-link">Profile</a>
        </nav>
    </header>

    <main class="container">
        <span class="icon i1">🎮</span>
        <span class="icon i3">⚡</span>

        <div class="join-card animate__animated animate__zoomIn">
            <h1 class="form-title">Enter <span class="highlight">Room</span></h1>
            <p class="form-subtitle">Join your friends and test your wits.</p>
            
            <form method="post">
                <div class="input-group">
                    <label class="input-label" for="name">Screen Name</label>
                    <input type="text" name="name" id="name" class="input-field" 
                           value="{{name}}" placeholder="e.g. QuizMaster99" required>
                </div>
                
                <div class="input-group">
                    <label class="input-label" for="code">Game Pin</label>
                    <input type="text" name="code" id="code" class="input-field" 
                           value="{{code}}" placeholder="4-digit code" required>
                </div>

                <button type="submit" class="btn-full">
                    Join Game 🚀
                </button>
            </form>

            {% if error %}
                <div class="error-msg animate__animated animate__shakeX">
                    {{ error }}
                </div>
            {% endif %}

            <p style="margin-top: 32px; font-size: 0.85rem; color: var(--muted); font-weight: 500;">
                Ready to show off your knowledge?
            </p>
        </div>
    </main>
</body>
</html>
