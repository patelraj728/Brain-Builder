<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Brain Builder</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #fafaf7;
            --surface: #ffffff;
            --ink: #1a1a1a;
            --muted: #6b7280;
            --line: #ececec;
            --field: #f6f6f3;
            --accent: #ff5b2e;
            --accent-soft: #fff1ec;
            --error-red: #c53030;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.03);
            text-align: center;
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 32px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
            position: relative; /* Essential for absolute positioning of toggle */
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            margin-bottom: 8px;
            margin-left: 4px;
        }

        input[type="password"], 
        input[type="text"] {
            width: 100%;
            padding: 16px;
            padding-right: 60px; /* Space for the toggle text */
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--ink);
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            background: var(--surface);
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }

        /* --- TOGGLE STYLING --- */
        .toggle-text {
            position: absolute;
            right: 16px;
            bottom: 15px; /* Aligns with input padding */
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--muted);
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }

        .toggle-text:hover { color: var(--accent); }

        .btn-update {
            width: 100%;
            padding: 16px;
            background: var(--ink);
            color: var(--bg);
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-update:hover {
            background: #000;
            transform: translateY(-1px);
        }

        #error {
            display: block;
            margin-bottom: 16px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--error-red);
            min-height: 1.2em;
        }

        .back-to-login {
            margin-top: 32px;
            display: block;
            text-decoration: none;
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-to-login:hover { color: var(--accent); }

        .reset-card { animation: fadeInUp 0.6s ease-out; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="reset-card">
        <h1>New Password</h1>
        <p class="subtitle">Set a secure password for your account.</p>

        <form id="passwordForm" action="/login/newpassword" method="post">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
                <span class="toggle-text" data-target="password">Show</span>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                <span class="toggle-text" data-target="confirm_password">Show</span>
            </div>

            <span id="error"></span>

            <button type="submit" class="btn-update">Update Password</button>
        </form>

        <a href="/" class="back-to-login">← Back to Login</a>
    </div>

    <script>
        // --- Password Match Validation ---
        document.getElementById("passwordForm").addEventListener("submit", function(e) {
            let pass = document.getElementById("password").value;
            let confirm = document.getElementById("confirm_password").value;
            let error = document.getElementById("error");

            if (pass !== confirm) {
                e.preventDefault(); 
                error.textContent = "Passwords do not match!";
                error.classList.add('animate__animated', 'animate__shakeX');
                setTimeout(() => error.classList.remove('animate__shakeX'), 500);
            } else {
                error.textContent = "";
            }
        });

        // --- Working Show/Hide Toggle ---
        document.querySelectorAll('.toggle-text').forEach(toggle => {
            toggle.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const input = document.getElementById(targetId);
                
                if (input.type === 'password') {
                    input.type = 'text';
                    this.textContent = 'Hide';
                } else {
                    input.type = 'password';
                    this.textContent = 'Show';
                }
            });
        });
    </script>
</body>
</html>
