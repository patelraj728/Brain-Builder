<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play | Brain Builder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #fafaf7;
            --surface: #ffffff;
            --ink: #1a1a1a;
            --muted: #6b7280;
            --line: #ececec;
            --field: #f6f6f3;
            --accent: #ff5b2e;
            --accent-soft: #fff1ec;
            --correct: #10b981;
            --wrong: #ef4444;
            /* Bonus Mode Palette */
            --bonus-bg: #1a1a1a;
            --bonus-ink: #fafaf7;
            --gold: #d4af37;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background: var(--bg); 
            color: var(--ink); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            transition: all 0.5s ease;
        }

        body.bonus-mode {
            background: var(--bonus-bg);
            color: var(--bonus-ink);
        }

        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .editorial-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            width: 100%;
            max-width: 600px;
            padding: 48px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.03);
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        body.bonus-mode .editorial-card {
            background: #252525;
            border-color: var(--gold);
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.2);
        }

        /* LOBBY SPECIFICS */
        .lobby-header { text-align: center; margin-bottom: 32px; }
        .lobby-header h1 { font-family: 'Fraunces', serif; font-size: 2.5rem; letter-spacing: -0.02em; }
        
        .waiting-status {
            background: var(--field);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin-bottom: 32px;
        }

        .spinner-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .spinner-dots span:nth-child(1) { animation-delay: -0.32s; }
        .spinner-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        .player-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .chip {
            padding: 8px 16px;
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .chip.me { border-color: var(--accent); color: var(--accent); }

        /* QUIZ TOP BAR */
        .quiz-ui-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .ui-badge {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 6px 12px;
            border-radius: 6px;
            background: var(--ink);
            color: var(--bg);
        }

        /* TIMER */
        .timer-track {
            height: 4px;
            background: var(--line);
            margin-bottom: 40px;
            border-radius: 2px;
        }
        .timer-progress {
            height: 100%;
            background: var(--accent);
            width: 100%;
            transition: width 1s linear;
        }

        /* QUESTION & OPTIONS */
        .question-text {
            font-family: 'Fraunces', serif;
            font-size: 1.8rem;
            line-height: 1.3;
            text-align: center;
            margin-bottom: 40px;
        }

        .option-list { display: flex; flex-direction: column; gap: 12px; }
        .option-item {
            font-family: 'Fraunces', serif;
            background: var(--surface);
            border: 1px solid var(--line);
            padding: 18px 24px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            font-size: 1.2rem;
            align-items: center;
            gap: 16px;
            transition: all 0.2s;
            font-weight: 600;
            text-align: left;
        }
        .option-item:hover:not(:disabled) { border-color: var(--accent); background: var(--field); }
        .option-item.selected { border-color: var(--ink); background: var(--field); }
        .option-item.dimmed { opacity: 0.4; filter: grayscale(1); }

        .marker {
            width: 28px;
            height: 28px;
            background: var(--field);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 0.7rem;
            color: var(--muted);
        }

        /* FEEDBACK */
        .feedback-overlay {
            text-align: center;
            display: none;
        }
        .feedback-overlay.active { display: block; animation: fadeIn 0.4s; }
        .feedback-title { font-family: 'Fraunces', serif; font-size: 3rem; margin-bottom: 10px; }

        /* SCOREBOARD OVERLAY */
        .full-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
        }
        .full-overlay.active { display: flex; }

        .score-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            padding: 24px;
        }

        .score-line {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--line);
            font-weight: 600;
        }
        .score-line:last-child { border: none; }
        .score-line.is-me { color: var(--accent); }

        /* BONUS SPECIFICS */
        .bonus-tag {
            color: var(--gold);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 0.7rem;
            margin-bottom: 8px;
            display: none;
        }
        body.bonus-mode .bonus-tag { display: block; }
        body.bonus-mode .ui-badge { background: var(--gold); color: #000; }
        body.bonus-mode .option-item { background: #333; border-color: #444; color: #fff; }
        body.bonus-mode .marker { background: #444; border-color: #555; }
        @media (max-width: 640px) {
        .option-item {color: #000;font-size: 1rem;}
        
        }
    </style>
</head>
<body>

<div class="main-container">
    
    <div id="lobby-view" class="editorial-card animate__animated animate__fadeIn">
        <div class="lobby-header">
            <p style="text-transform: uppercase; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px;">Joined as</p>
            <h1>{{ session.get('name') }}</h1>
        </div>

        <div class="waiting-status">
            <div class="spinner-dots"><span></span><span></span><span></span></div>
            <p style="margin-top: 12px; font-weight: 600; font-size: 0.9rem;">Waiting for the host to begin</p>
        </div>

        <p style="text-align: center; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 16px;">Current Players (<span id="player-count">0</span>)</p>
        <div class="player-grid" id="players-chips"></div>
    </div>

    <div id="quiz-view" class="editorial-card" style="display: none;">
        <div class="quiz-ui-header">
            <div class="ui-badge">👤 {{ session.get('name') }}</div>
            <div class="ui-badge" style="background: var(--accent);">⭐ <span id="my-score">0</span></div>
        </div>

        <div class="timer-track">
            <div class="timer-progress" id="timer-bar"></div>
        </div>

        <div id="question-area">
            <div class="bonus-tag" style="text-align: center;">✦ Bonus Question ✦</div>
            <h2 class="question-text" id="question-text">Waiting for question...</h2>
            <div class="option-list" id="options-grid"></div>
        </div>

        <div id="feedback-screen" class="feedback-overlay">
            <div id="feedback-icon" style="font-size: 4rem; margin-bottom: 10px;"></div>
            <h2 id="feedback-msg" class="feedback-title"></h2>
            <p id="feedback-sub" style="font-weight: 600; color: var(--muted);"></p>
            <div id="feedback-points" style="margin-top: 20px; font-weight: 800; font-size: 1.5rem; color: var(--accent);"></div>
        </div>

        <div id="waiting-others" style="display:none; text-align: center; margin-top: 40px;">
            <p style="font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted);">Answer Locked • Waiting for Others</p>
        </div>
    </div>
</div>

<div id="scoreboard-overlay" class="full-overlay">
    <h1 style="font-family: 'Fraunces', serif; font-size: 2.5rem; margin-bottom: 32px;">Leaderboard</h1>
    <div class="score-card" id="scoreboard-list"></div>
    <p style="margin-top: 32px; color: var(--muted); font-weight: 600;">Host will continue shortly...</p>
</div>

<div id="finished-screen" class="full-overlay" style="background: var(--bg); color: var(--ink);">
    <p style="text-transform: uppercase; font-weight: 800; letter-spacing: 0.2em; opacity: 0.6;">Your Score is</p>
    <h1 style="font-family: 'Fraunces', serif; font-size: 5rem;" id="final-score-val">0</h1>
    <div class="score-card" id="final-scoreboard-list" style="background: transparent; border-color: #333; color: #fff;"></div>
    <a href="/login/home" style="margin-top: 40px; color: var(--accent); text-decoration: none; font-weight: 800; text-transform: uppercase; font-size: 0.8rem;">← Exit to Home</a>
</div>

<script>
    var socketio = io();
    const myName = "{{ session.get('name') }}";

    // LOBBY
    socketio.on("message", function(data){
        const players = data.name.filter(n => n !== "Host");
        document.getElementById("player-count").innerText = players.length;
        const chips = document.getElementById("players-chips");
        chips.innerHTML = "";
        players.forEach(name => {
            const chip = document.createElement("div");
            chip.className = "chip" + (name === myName ? " me" : "");
            chip.textContent = name;
            chips.appendChild(chip);
        });
    });

    socketio.on("redirect_to_live", function(){
        document.getElementById("lobby-view").style.display = "none";
        document.getElementById("quiz-view").style.display = "block";
    });

    // QUIZ
    let timerInterval;
    let myScore = 0;
    let hasAnswered = false;

    socketio.on("show_question", function(data){
        hasAnswered = false;
        document.body.classList.toggle("bonus-mode", !!data.is_bonus);
        
        document.getElementById("question-area").style.display = "block";
        document.getElementById("feedback-screen").classList.remove("active");
        document.getElementById("waiting-others").style.display = "none";
        document.getElementById("scoreboard-overlay").classList.remove("active");

        document.getElementById("question-text").innerText = data.question;
        const labels = ["A", "B", "C", "D"];
        const grid = document.getElementById("options-grid");
        grid.innerHTML = "";
        
        data.options.forEach((opt, i) => {
            const btn = document.createElement("button");
            btn.className = "option-item";
            btn.innerHTML = `<div class="marker">${labels[i]}</div><span>${opt.text}</span>`;
            btn.onclick = function(){ submitAnswer(opt.id, btn); };
            grid.appendChild(btn);
        });

        startTimer(data.time_limit || 15);
    });

    function startTimer(seconds){
        clearInterval(timerInterval);
        const bar = document.getElementById("timer-bar");
        bar.style.transition = "none";
        bar.style.width = "100%";
        setTimeout(() => {
            bar.style.transition = `width ${seconds}s linear`;
            bar.style.width = "0%";
        }, 50);
    }

    function submitAnswer(optionId, clickedBtn){
        if(hasAnswered) return;
        hasAnswered = true;
        clearInterval(timerInterval);
        document.querySelectorAll(".option-item").forEach(btn => {
            btn.disabled = true;
            if(btn !== clickedBtn) btn.classList.add("dimmed");
        });
        clickedBtn.classList.add("selected");
        socketio.emit("submit_answer", { option_id: optionId });
        document.getElementById("waiting-others").style.display = "block";
    }

    socketio.on("answer_result", function(data){
        myScore = data.your_score;
        document.getElementById("my-score").innerText = myScore;
        showFeedback(data.is_correct, data.points_gained || 0, false);
    });

    function showFeedback(isCorrect, points, timedOut){
        document.getElementById("question-area").style.display = "none";
        document.getElementById("waiting-others").style.display = "none";
        const fb = document.getElementById("feedback-screen");
        fb.classList.add("active");

        const icon = document.getElementById("feedback-icon");
        const msg = document.getElementById("feedback-msg");
        
        if(timedOut){
            icon.innerText = "⏰"; msg.innerText = "Expired";
        } else if(isCorrect){
            icon.innerText = "✦"; msg.innerText = "Correct";
            document.getElementById("feedback-points").innerText = `+${points} PTS`;
        } else {
            icon.innerText = "✕"; msg.innerText = "Incorrect";
            document.getElementById("feedback-points").innerText = "";
        }
    }

    socketio.on("show_scoreboard_all", function(data){
        document.body.classList.remove("bonus-mode");
        document.getElementById("feedback-screen").classList.remove("active");
        const sorted = Object.entries(data.scores).sort((a,b) => b[1]-a[1]);
        let html = "";
        sorted.forEach(([name, score], i) => {
            html += `<div class="score-line ${name === myName ? 'is-me' : ''}">
                        <span>${i+1}. ${name}</span>
                        <span>${score}</span>
                    </div>`;
        });
        document.getElementById("scoreboard-list").innerHTML = html;
        document.getElementById("scoreboard-overlay").classList.add("active");
    });

    socketio.on("quiz_finished", function(scores){
        document.getElementById("final-score-val").innerText = scores[myName] || myScore;
        document.getElementById("finished-screen").classList.add("active");
    });
</script>
</body>
</html>
