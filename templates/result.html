<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session Summary | Brain Builder</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #fafaf7;
            --surface: #ffffff;
            --ink: #1a1a1a;
            --muted: #6b7280;
            --line: #ececec;
            --accent: #4ba0f0;
            --secondary: #f78e4d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body { 
            background: var(--bg); 
            color: var(--ink); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            overflow: hidden;
        }

        /* --- BACKGROUND BLOBS --- */
        .bg-blob { position: fixed; width: 50vw; height: 50vw; border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.1; }
        .blob-1 { background: var(--accent); top: -20%; left: -10%; }
        .blob-2 { background: var(--secondary); bottom: -20%; right: -10%; }

        /* --- RESULT CARD --- */
        .result-card {
            background: var(--surface);
            width: 100%;
            max-width: 550px;
            padding: 60px 40px;
            border-radius: 40px;
            border: 1px solid var(--line);
            box-shadow: 0 20px 60px rgba(0,0,0,0.04);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* Trophy/Icon Styling */
        .status-icon {
            font-size: 70px;
            margin-bottom: 20px;
            display: inline-block;
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .category-tag {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-size: 2.5rem;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 12px;
        }

        #performance-msg {
            font-size: 1.1rem;
            color: var(--muted);
            font-weight: 500;
            margin-bottom: 40px;
        }

        /* --- SCORE DISPLAY --- */
        .score-container {
            margin-bottom: 40px;
            padding: 40px;
            background: #fdfdfb;
            border: 1px solid var(--line);
            border-radius: 24px;
            position: relative;
        }

        .score-value {
            font-family: 'Fraunces', serif;
            font-size: 5rem;
            font-weight: 800;
            color: var(--ink);
            line-height: 1;
        }

        .score-label {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--muted);
            margin-top: 15px;
        }

        /* --- ACTIONS --- */
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--ink);
            color: white;
            border-color: var(--ink);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--ink);
        }

        .btn-secondary:hover {
            background: var(--bg);
            border-color: var(--ink);
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        @media (max-width: 600px) {
            .result-card { border: none; box-shadow: none; background: transparent; padding: 20px; }
            .score-value { font-size: 4rem; }
        }
    </style>
</head>

<body>

<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>

<canvas id="confetti-canvas"></canvas>

<main class="result-card animate__animated animate__fadeInUp">
    <div class="status-icon" id="status-emoji">🏆</div>
    
    <span class="category-tag">Session Complete</span>
    <h1>Nice work!</h1>
    <p id="performance-msg">Analyzing your performance...</p>

    <div class="score-container">
        <div class="score-value" id="animated-score">0</div>
        <div class="score-label">Points Secured</div>
    </div>

    <footer class="btn-group">
        <a href="/solo/quiz" class="btn btn-primary">
            Play Again
        </a>
        <a href="/login/home" class="btn btn-secondary">
            Home
        </a>
    </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

<script>
    const finalScore = parseInt("{{ score }}") || 0;
    
    function animateValue(obj, start, end, duration) {
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            obj.innerHTML = Math.floor(progress * (end - start) + start);
            if (progress < 1) {
                window.requestAnimationFrame(step);
            }
        };
        window.requestAnimationFrame(step);
    }

    window.onload = () => {
        const scoreEl = document.getElementById("animated-score");
        const msgEl = document.getElementById("performance-msg");
        const emojiEl = document.getElementById("status-emoji");
        
        animateValue(scoreEl, 0, finalScore, 2000);

        // Curated Feedback
        if (finalScore === 0) {
            msgEl.innerText = "The first step to mastery is showing up.";
            emojiEl.innerText = "🌱";
        } else if (finalScore < 50) {
            msgEl.innerText = "A solid performance. You're getting the hang of it!";
            emojiEl.innerText = "✨";
        } else {
            msgEl.innerText = "Exceptional work. You've set the bar high!";
            emojiEl.innerText = "🏆";
            
            // Fire Confetti only for high scores
            var end = Date.now() + (2 * 1000);
            (function frame() {
                confetti({
                    particleCount: 2,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#4ba0f0', '#f78e4d']
                });
                confetti({
                    particleCount: 2,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#4ba0f0', '#f78e4d']
                });

                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }
    };
</script>

</body>
</html>
